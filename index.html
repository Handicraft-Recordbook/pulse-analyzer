<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-type" content="text/html;charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pulse Wave Analyzer</title>
  <style>
    :root {
      --bg: #0d0f12;
      --card-bg: #161920;
      --accent: #00d2ff;
      --accent-red: #ff3366;
      --text: #e0e6ed;
      --text-muted: #8a99ad;
      --border: #262c38;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      padding: 8px 10px;
      overflow: hidden;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding-bottom: 4px;
      flex-shrink: 0;
    }
    h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.3px;
      color: #fff;
    }
    .header-date-container {
      font-size: 10px;
      color: var(--text-muted);
      font-family: "SF Mono", Menlo, Consolas, monospace;
    }
    .top-controls {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 6px;
      flex-shrink: 0;
    }
    .action-btn {
      width: 100%;
      height: 36px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.1s;
    }
    .action-btn:active { transform: scale(0.98); }
    .btn-start { background: linear-gradient(135deg, #0088ff, #00d2ff); color: #fff; }
    .btn-stop  { background: linear-gradient(135deg, #d90429, #ff3366); color: #fff; }
    .mic-select-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .mic-select-label {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .mic-select {
      flex: 1;
      height: 26px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 0 8px;
      font-size: 11px;
      outline: none;
    }
    .params-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 10px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-bottom: 6px;
      flex-shrink: 0;
    }
    .param-row {
      display: flex;
      align-items: center;
      height: 24px;
      gap: 8px;
    }
    .param-label {
      width: 95px;
      font-size: 11px;
      color: var(--text);
      flex-shrink: 0;
    }
    .param-slider {
      flex: 1;
      accent-color: var(--accent);
      height: 4px;
      cursor: pointer;
    }
    .param-val {
      width: 48px;
      text-align: right;
      font-family: "SF Mono", Menlo, Consolas, monospace;
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      flex-shrink: 0;
    }
    .chart-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 6px;
      margin-bottom: 5px;
      flex-shrink: 0;
    }
    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2px;
      font-size: 10px;
      color: var(--text-muted);
    }
    .chart-title { font-weight: 600; color: #cbd5e1; }
    .status-badge {
      padding: 1px 5px;
      border-radius: 4px;
      font-family: "SF Mono", Menlo, monospace;
      font-size: 9px;
      background: #242c3d;
      color: #94a3b8;
    }
    .status-badge.captured { background: #064e3b; color: #34d399; }
    #timeCanvas {
      display: block;
      width: 100%;
      aspect-ratio: 5 / 3;
      background: #090b0e;
      border-radius: 4px;
    }
    #freqCanvas {
      display: block;
      width: 100%;
      aspect-ratio: 5 / 2;
      background: #090b0e;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Pulse Wave Analyzer</h1>
    <div class="header-date-container">
      Recording day: <span id="currentDate">----/--/--</span>
    </div>
  </header>

  <div class="top-controls">
    <button id="toggleBtn" class="action-btn btn-start">Start Microphone</button>
    <div class="mic-select-row">
      <span class="mic-select-label">Mic Selection:</span>
      <select id="micSelect" class="mic-select"></select>
    </div>
  </div>

  <div class="params-container">
    <div class="param-row">
      <span class="param-label">Trigger Threshold</span>
      <input type="range" id="threshold" class="param-slider" min="0.01" max="0.5" step="0.01" value="0.10">
      <span id="thVal" class="param-val">0.10</span>
    </div>
    <div class="param-row">
      <span class="param-label">Time Span</span>
      <input type="range" id="timeSpan" class="param-slider" min="50" max="600" step="10" value="300">
      <span id="tsVal" class="param-val">300ms</span>
    </div>
    <div class="param-row">
      <span class="param-label">Vertical Scale</span>
      <input type="range" id="vScale" class="param-slider" min="0.5" max="10.0" step="0.5" value="1.0">
      <span id="vsVal" class="param-val">1.0x</span>
    </div>
  </div>

  <div class="chart-card">
    <div class="chart-header">
      <span class="chart-title">Pulse Waveform (Time Domain)</span>
      <span id="statusBadge" class="status-badge">STANDBY</span>
    </div>
    <canvas id="timeCanvas"></canvas>
  </div>

  <div class="chart-card">
    <div class="chart-header">
      <span class="chart-title">Frequency Spectrum (FFT)</span>
      <span id="freqRange">0Hz - 8kHz</span>
    </div>
    <canvas id="freqCanvas"></canvas>
  </div>

<script>
// ─── Date (live clock for long sessions) ────────────────────────────────────
function updateDate() {
  const d = new Date();
  document.getElementById('currentDate').textContent =
    `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
}
updateDate();
setInterval(updateDate, 60000);

// ─── UI refs ────────────────────────────────────────────────────────────────
const toggleBtn     = document.getElementById('toggleBtn');
const micSelect     = document.getElementById('micSelect');
const thresholdInput= document.getElementById('threshold');
const timeSpanInput = document.getElementById('timeSpan');
const vScaleInput   = document.getElementById('vScale');
const thVal         = document.getElementById('thVal');
const tsVal         = document.getElementById('tsVal');
const vsVal         = document.getElementById('vsVal');
const statusBadge   = document.getElementById('statusBadge');
const timeCanvas    = document.getElementById('timeCanvas');
const freqCanvas    = document.getElementById('freqCanvas');
const tCtx          = timeCanvas.getContext('2d');
const fCtx          = freqCanvas.getContext('2d');

// ─── Slider handlers ────────────────────────────────────────────────────────
thresholdInput.oninput = () => thVal.textContent = parseFloat(thresholdInput.value).toFixed(2);
timeSpanInput.oninput  = () => {
  tsVal.textContent = timeSpanInput.value + 'ms';
  if (lastCapturedWave) renderTimeDomain(lastCapturedWave);
};
vScaleInput.oninput = () => {
  vsVal.textContent = parseFloat(vScaleInput.value).toFixed(1) + 'x';
  if (lastCapturedWave) renderTimeDomain(lastCapturedWave);
};

// ─── Audio engine state ──────────────────────────────────────────────────────
let audioCtx      = null;
let analyser      = null;
let sourceNode    = null;
let currentStream = null;
let isRunning     = false;
let animFrameId   = null;
let actualSampleRate = 44100;

// ─── Ring buffer ─────────────────────────────────────────────────────────────
const PRE_TRIGGER_MS  = 10;
const BUFFER_SECONDS  = 3;
const BUFFER_SIZE     = Math.pow(2, Math.ceil(Math.log2(44100 * BUFFER_SECONDS)));
const ringBuffer      = new Float32Array(BUFFER_SIZE);
let   ringHead        = 0;

let isTriggerLocked  = false;
let lastCapturedWave = null;
let lastCapturedFreq = null;

// ─── Canvas size cache ───────────────────────────────────────────────────────
const canvasSize = {
  time: { w: 0, h: 0 },
  freq: { w: 0, h: 0 }
};

function resizeCanvas(canvas, ctx, cacheKey) {
  const dpr  = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const w    = rect.width;
  const h    = rect.height;
  canvas.width  = w * dpr;
  canvas.height = h * dpr;
  ctx.resetTransform();
  ctx.scale(dpr, dpr);
  canvasSize[cacheKey] = { w, h };
}

let resizeTimer = null;
function initCanvases() {
  resizeCanvas(timeCanvas, tCtx, 'time');
  resizeCanvas(freqCanvas,  fCtx, 'freq');
  drawTimeGrid();
  drawFreqGrid();
  if (lastCapturedWave) renderTimeDomain(lastCapturedWave);
  if (lastCapturedFreq) renderFrequency(lastCapturedFreq);
}
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(initCanvases, 150);
});
setTimeout(initCanvases, 100);

// ─── Mic enumeration ─────────────────────────────────────────────────────────
async function populateMics() {
  try {
    const devices    = await navigator.mediaDevices.enumerateDevices();
    const audioIn    = devices.filter(d => d.kind === 'audioinput');
    const currentVal = micSelect.value;
    micSelect.innerHTML = '';

    if (audioIn.length === 0) {
      const opt = document.createElement('option');
      opt.value = '';
      opt.textContent = 'No microphone found';
      micSelect.appendChild(opt);
      return;
    }

    audioIn.forEach((device, index) => {
      const opt = document.createElement('option');
      opt.value = device.deviceId;
      opt.textContent = device.label || `Microphone ${index + 1} (${device.deviceId.slice(0,5)}...)`;
      micSelect.appendChild(opt);
    });

    if (currentVal && Array.from(micSelect.options).some(o => o.value === currentVal)) {
      micSelect.value = currentVal;
    }
  } catch (err) {
    console.warn('enumerateDevices failed:', err);
  }
}
navigator.mediaDevices.ondevicechange = populateMics;

// ─── Toggle button ────────────────────────────────────────────────────────────
toggleBtn.addEventListener('click', async () => {
  if (isRunning) stopAudio(true);
  else           await startAudio();
});

micSelect.addEventListener('change', async () => {
  if (isRunning) { stopAudio(false); await startAudio(); }
});

// ─── Start audio ──────────────────────────────────────────────────────────────
async function startAudio() {
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 44100 });
    if (audioCtx.state === 'suspended') await audioCtx.resume();

    actualSampleRate = audioCtx.sampleRate;
    document.getElementById('freqRange').textContent =
      `0Hz – ${Math.round(actualSampleRate / 2 / 1000)}kHz`;

    const deviceConstraint = micSelect.value ? { exact: micSelect.value } : undefined;
    currentStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        deviceId:          deviceConstraint,
        autoGainControl:   false,
        echoCancellation:  false,
        noiseSuppression:  false
      }
    });

    await populateMics();

    sourceNode = audioCtx.createMediaStreamSource(currentStream);
    analyser   = audioCtx.createAnalyser();
    analyser.fftSize               = 2048;
    analyser.smoothingTimeConstant = 0.1;
    sourceNode.connect(analyser);

    pcmChunk = new Float32Array(analyser.fftSize);

    isRunning = true;
    toggleBtn.textContent = 'Stop Recording';
    toggleBtn.className   = 'action-btn btn-stop';

    processLoop();
  } catch (err) {
    if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
      alert('Microphone permission was denied.\nPlease allow microphone access in Settings and try again.');
    } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
      alert('No microphone found.\nPlease connect a microphone and try again.');
    } else {
      alert('Microphone initialization failed:\n' + err.message);
    }
  }
}

// ─── Stop audio ───────────────────────────────────────────────────────────────
function stopAudio(fullReset = true) {
  isRunning = false;
  if (animFrameId) { cancelAnimationFrame(animFrameId); animFrameId = null; }
  if (currentStream) { currentStream.getTracks().forEach(t => t.stop()); currentStream = null; }
  if (sourceNode)  { sourceNode.disconnect(); sourceNode = null; }
  analyser = null;
  if (audioCtx) { audioCtx.close(); audioCtx = null; }

  if (fullReset) {
    toggleBtn.textContent = 'Start Microphone';
    toggleBtn.className   = 'action-btn btn-start';
    statusBadge.textContent  = 'STANDBY';
    statusBadge.className    = 'status-badge';
  }
}

// ─── Processing loop ──────────────────────────────────────────────────────────
let pcmChunk = new Float32Array(2048);

function processLoop() {
  if (!isRunning) return;
  animFrameId = requestAnimationFrame(processLoop);

  analyser.getFloatTimeDomainData(pcmChunk);

  for (let i = 0; i < pcmChunk.length; i++) {
    ringBuffer[ringHead] = pcmChunk[i];
    ringHead = (ringHead + 1) % BUFFER_SIZE;
  }

  if (isTriggerLocked) return;

  const threshold = parseFloat(thresholdInput.value);
  let maxVal = 0;
  for (let i = 0; i < pcmChunk.length; i++) {
    const v = Math.abs(pcmChunk[i]);
    if (v > maxVal) maxVal = v;
  }

  if (maxVal <= threshold) return;

  isTriggerLocked = true;
  statusBadge.textContent = 'CAPTURED';
  statusBadge.className   = 'status-badge captured';

  const maxPostMs   = parseInt(timeSpanInput.max);
  const preSamples  = Math.floor(actualSampleRate * PRE_TRIGGER_MS / 1000);
  const postSamples = Math.floor(actualSampleRate * maxPostMs / 1000);
  const totalSamples= preSamples + postSamples;

  let triggerOffsetInChunk = 0;
  for (let i = 0; i < pcmChunk.length; i++) {
    if (Math.abs(pcmChunk[i]) > threshold) { triggerOffsetInChunk = i; break; }
  }
  const triggerRingPos = ((ringHead - pcmChunk.length + triggerOffsetInChunk) % BUFFER_SIZE + BUFFER_SIZE) % BUFFER_SIZE;
  const startIdx = ((triggerRingPos - preSamples) % BUFFER_SIZE + BUFFER_SIZE) % BUFFER_SIZE;

  const captured = new Float32Array(totalSamples);
  for (let i = 0; i < totalSamples; i++) {
    captured[i] = ringBuffer[(startIdx + i) % BUFFER_SIZE];
  }
  lastCapturedWave = captured;
  renderTimeDomain(lastCapturedWave);

  const freqData = new Float32Array(analyser.frequencyBinCount);
  analyser.getFloatFrequencyData(freqData);
  lastCapturedFreq = freqData;
  renderFrequency(lastCapturedFreq);

  setTimeout(() => {
    isTriggerLocked = false;
    if (isRunning) {
      statusBadge.textContent = 'STANDBY';
      statusBadge.className   = 'status-badge';
    }
  }, 1500);
}

// ─── Time-domain grid ─────────────────────────────────────────────────────────
function drawTimeGrid(pL = 50, pB = 26, postDurationMs = 300, scale = 1.0) {
  const { w: W, h: H } = canvasSize.time;
  if (!W || !H) return;
  tCtx.clearRect(0, 0, W, H);

  const plotW = W - pL - 6;
  const plotH = H - pB;

  tCtx.strokeStyle = '#1d222d';
  tCtx.lineWidth   = 1;
  tCtx.fillStyle   = '#64748b';
  tCtx.font        = '9px "SF Mono", monospace';

  const vLimit = 1.0 / scale;
  const vSteps = [
    { ratio: 0.0,  label: `+${vLimit.toFixed(2)}` },
    { ratio: 0.25, label: `+${(vLimit * 0.5).toFixed(2)}` },
    { ratio: 0.5,  label: ` 0.00` },
    { ratio: 0.75, label: `-${(vLimit * 0.5).toFixed(2)}` },
    { ratio: 1.0,  label: `-${vLimit.toFixed(2)}` }
  ];
  vSteps.forEach(s => {
    const y = s.ratio * plotH;
    tCtx.beginPath(); tCtx.moveTo(pL, y); tCtx.lineTo(W, y); tCtx.stroke();
    tCtx.fillText(s.label, 2, y + 3);
  });

  const totalMs = PRE_TRIGGER_MS + postDurationMs;
  const triggerX = pL + (PRE_TRIGGER_MS / totalMs) * plotW;
  tCtx.strokeStyle = '#ff3366';
  tCtx.lineWidth   = 1;
  tCtx.setLineDash([3, 3]);
  tCtx.beginPath(); tCtx.moveTo(triggerX, 0); tCtx.lineTo(triggerX, plotH); tCtx.stroke();
  tCtx.setLineDash([]);
  tCtx.fillStyle = '#ff3366';
  tCtx.fillText('0ms', triggerX - 10, H - 8);

  tCtx.strokeStyle = '#1d222d';
  tCtx.lineWidth   = 1;
  tCtx.fillStyle   = '#64748b';
  tCtx.fillText(`-${PRE_TRIGGER_MS}ms`, pL + 1, H - 8);

  const tickIntervalMs = postDurationMs <= 150 ? 50 : 100;
  for (let ms = tickIntervalMs; ms <= postDurationMs; ms += tickIntervalMs) {
    const x = pL + ((PRE_TRIGGER_MS + ms) / totalMs) * plotW;
    tCtx.beginPath(); tCtx.moveTo(x, 0); tCtx.lineTo(x, plotH); tCtx.stroke();
    tCtx.fillText(`${ms}ms`, x - 10, H - 8);
  }
}

// ─── Time-domain wave render ──────────────────────────────────────────────────
function renderTimeDomain(wave) {
  const postDurationMs = parseInt(timeSpanInput.value);
  const scale          = parseFloat(vScaleInput.value);
  const pL = 50, pB = 26;

  drawTimeGrid(pL, pB, postDurationMs, scale);

  const { w: W, h: H } = canvasSize.time;
  if (!W || !H) return;

  const plotW   = W - pL - 6;
  const plotH   = H - pB;
  const centerY = plotH / 2;

  const totalMs      = PRE_TRIGGER_MS + postDurationMs;
  const totalSamples = Math.floor(actualSampleRate * totalMs / 1000);
  const step = Math.max(1, totalSamples / plotW);

  tCtx.strokeStyle = '#00d2ff';
  tCtx.lineWidth   = 1.5;
  tCtx.beginPath();

  let started = false;
  for (let px = 0; px < plotW; px++) {
    const sampleIdx = Math.floor(px * step);
    if (sampleIdx >= wave.length) break;

    let minV = wave[sampleIdx], maxV = wave[sampleIdx];
    const endIdx = Math.min(wave.length - 1, Math.floor((px + 1) * step));
    for (let s = sampleIdx + 1; s <= endIdx; s++) {
      if (wave[s] < minV) minV = wave[s];
      if (wave[s] > maxV) maxV = wave[s];
    }

    const clampedMax = Math.max(-1, Math.min(1, maxV * scale));
    const clampedMin = Math.max(-1, Math.min(1, minV * scale));
    const yTop    = centerY - clampedMax * centerY;
    const yBottom = centerY - clampedMin * centerY;

    const x = pL + px;
    if (!started) { tCtx.moveTo(x, yTop); started = true; }
    else {
      if (Math.abs(yTop - yBottom) < 1) {
        tCtx.lineTo(x, yTop);
      } else {
        tCtx.lineTo(x, yTop);
        tCtx.lineTo(x, yBottom);
      }
    }
  }
  tCtx.stroke();
}

// ─── Frequency spectrum grid ──────────────────────────────────────────────────
function drawFreqGrid(pL = 40, pB = 22) {
  const { w: W, h: H } = canvasSize.freq;
  if (!W || !H) return;
  fCtx.clearRect(0, 0, W, H);

  const plotW = W - pL - 6;
  const plotH = H - pB;

  fCtx.strokeStyle = '#1d222d';
  fCtx.lineWidth   = 1;
  fCtx.fillStyle   = '#64748b';
  fCtx.font        = '9px "SF Mono", monospace';

  const dbMin = -100, dbMax = 0;
  const dbSteps = [0, -20, -40, -60, -80, -100];
  dbSteps.forEach(db => {
    const ratio = (dbMax - db) / (dbMax - dbMin);
    const y     = ratio * plotH;
    fCtx.beginPath(); fCtx.moveTo(pL, y); fCtx.lineTo(W, y); fCtx.stroke();
    fCtx.fillText(`${db}`, 2, y + 3);
  });

  const nyquist     = actualSampleRate / 2;
  const freqTicksHz = [1000, 2000, 3000, 4000, 5000, 6000, 7000, 8000].filter(f => f <= nyquist);
  freqTicksHz.forEach(hz => {
    const x = pL + (hz / nyquist) * plotW;
    fCtx.beginPath(); fCtx.moveTo(x, 0); fCtx.lineTo(x, plotH); fCtx.stroke();
    fCtx.fillText(`${hz >= 1000 ? (hz/1000)+'k' : hz}`, x - 8, H - 5);
  });
  fCtx.fillText('0', pL + 1, H - 5);
}

// ─── Frequency spectrum render ────────────────────────────────────────────────
function renderFrequency(freqData) {
  const pL = 40, pB = 22;
  drawFreqGrid(pL, pB);

  const { w: W, h: H } = canvasSize.freq;
  if (!W || !H) return;

  const plotW  = W - pL - 6;
  const plotH  = H - pB;
  const dbMin  = -100, dbMax = 0;
  const nyquist = actualSampleRate / 2;
  const maxHz  = Math.min(8000, nyquist);
  const maxBin = Math.floor(freqData.length * maxHz / nyquist);

  const grad = fCtx.createLinearGradient(0, 0, 0, plotH);
  grad.addColorStop(0,   '#00d2ff');
  grad.addColorStop(0.5, '#0088ff');
  grad.addColorStop(1,   '#0044aa');

  fCtx.beginPath();
  fCtx.moveTo(pL, plotH);

  for (let px = 0; px < plotW; px++) {
    const bin = Math.floor((px / plotW) * maxBin);
    const db  = Math.max(dbMin, Math.min(dbMax, freqData[bin]));
    const y   = ((dbMax - db) / (dbMax - dbMin)) * plotH;
    if (px === 0) fCtx.lineTo(pL, y);
    else          fCtx.lineTo(pL + px, y);
  }

  fCtx.lineTo(pL + plotW, plotH);
  fCtx.closePath();
  fCtx.fillStyle = grad;
  fCtx.fill();

  fCtx.beginPath();
  for (let px = 0; px < plotW; px++) {
    const bin = Math.floor((px / plotW) * maxBin);
    const db  = Math.max(dbMin, Math.min(dbMax, freqData[bin]));
    const y   = ((dbMax - db) / (dbMax - dbMin)) * plotH;
    if (px === 0) fCtx.moveTo(pL, y);
    else          fCtx.lineTo(pL + px, y);
  }
  fCtx.strokeStyle = '#00d2ff';
  fCtx.lineWidth   = 1.2;
  fCtx.stroke();
}
<\/script>
</body>
</html>
