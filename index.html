<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pulse Analyzer Pro</title>
  <style>
    :root {
      --bg: #0d0f12;
      --card-bg: #161920;
      --accent: #00d2ff;
      --accent-red: #ff3366;
      --text: #e0e6ed;
      --text-muted: #8a99ad;
      --border: #262c38;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh; /* iOS Safariのアドレスバー考慮 */
      padding: 8px 10px;
      overflow: hidden; /* スクロール完全防止 */
    }

    /* ヘッダーエリア */
    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding-bottom: 4px;
      flex-shrink: 0;
    }
    h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.3px;
      color: #fff;
    }
    .header-date {
      font-size: 10px; /* タイトルの約2/3サイズ */
      color: var(--text-muted);
      font-family: "SF Mono", Menlo, Consolas, monospace;
    }

    /* マイク制御 & デバイス選択 */
    .top-controls {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 6px;
      flex-shrink: 0;
    }
    .action-btn {
      width: 100%;
      height: 36px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.1s;
    }
    .action-btn:active {
      transform: scale(0.98);
    }
    .btn-start {
      background: linear-gradient(135deg, #0088ff, #00d2ff);
      color: #fff;
    }
    .btn-stop {
      background: linear-gradient(135deg, #d90429, #ff3366);
      color: #fff;
    }
    .mic-select {
      width: 100%;
      height: 26px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 0 8px;
      font-size: 11px;
      outline: none;
    }

    /* パラメーターコントロール（1行横並び配置） */
    .params-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 10px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-bottom: 6px;
      flex-shrink: 0;
    }
    .param-row {
      display: flex;
      align-items: center;
      height: 24px;
      gap: 8px;
    }
    .param-label {
      width: 82px;
      font-size: 11px;
      color: var(--text);
      flex-shrink: 0;
    }
    .param-slider {
      flex: 1;
      accent-color: var(--accent);
      height: 4px;
      cursor: pointer;
    }
    .param-val {
      width: 48px;
      text-align: right;
      font-family: "SF Mono", Menlo, Consolas, monospace;
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      flex-shrink: 0;
    }

    /* グラフセクション（高さを低く抑えて1画面に収める） */
    .chart-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 6px;
      margin-bottom: 5px;
      flex-shrink: 0;
    }
    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2px;
      font-size: 10px;
      color: var(--text-muted);
    }
    .chart-title {
      font-weight: 600;
      color: #cbd5e1;
    }
    .status-badge {
      padding: 1px 5px;
      border-radius: 4px;
      font-family: "SF Mono", Menlo, monospace;
      font-size: 9px;
      background: #242c3d;
      color: #94a3b8;
    }
    .status-badge.captured {
      background: #064e3b;
      color: #34d399;
    }

    /* グラフCanvas（アスペクト比 5:2 で低背化） */
    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 5 / 2;
      background: #090b0e;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <header>
    <h1>パルス波形アナライザー</h1>
    <div id="currentDate" class="header-date">----/--/--</div>
  </header>

  <!-- 上部操作（トグルボタン & マイク選択） -->
  <div class="top-controls">
    <button id="toggleBtn" class="action-btn btn-start">マイク入力開始</button>
    <select id="micSelect" class="mic-select">
      <option value="">デフォルトマイク (内蔵)</option>
    </select>
  </div>

  <!-- パラメーターコントロール（横並びレイアウト） -->
  <div class="params-container">
    <div class="param-row">
      <span class="param-label">トリガー閾値</span>
      <input type="range" id="threshold" class="param-slider" min="0.01" max="0.5" step="0.01" value="0.10">
      <span id="thVal" class="param-val">0.10</span>
    </div>
    <div class="param-row">
      <span class="param-label">波形 表示時間</span>
      <input type="range" id="timeSpan" class="param-slider" min="50" max="600" step="10" value="300">
      <span id="tsVal" class="param-val">300ms</span>
    </div>
    <div class="param-row">
      <span class="param-label">波形 スケール</span>
      <input type="range" id="vScale" class="param-slider" min="0.5" max="10.0" step="0.5" value="1.0">
      <span id="vsVal" class="param-val">1.0x</span>
    </div>
  </div>

  <!-- パルス波形グラフ -->
  <div class="chart-card">
    <div class="chart-header">
      <span class="chart-title">パルス波形 (Time Domain)</span>
      <span id="statusBadge" class="status-badge">STANDBY</span>
    </div>
    <canvas id="timeCanvas"></canvas>
  </div>

  <!-- 周波数スペクトルグラフ -->
  <div class="chart-card">
    <div class="chart-header">
      <span class="chart-title">周波数スペクトル (FFT)</span>
      <span>0Hz - 8kHz</span>
    </div>
    <canvas id="freqCanvas"></canvas>
  </div>

  <script>
    // 1. 日付表示の設定
    const d = new Date();
    const dateStr = `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`;
    document.getElementById('currentDate').textContent = dateStr;

    // UI要素の参照
    const toggleBtn = document.getElementById('toggleBtn');
    const micSelect = document.getElementById('micSelect');
    const thresholdInput = document.getElementById('threshold');
    const timeSpanInput = document.getElementById('timeSpan');
    const vScaleInput = document.getElementById('vScale');
    const thVal = document.getElementById('thVal');
    const tsVal = document.getElementById('tsVal');
    const vsVal = document.getElementById('vsVal');
    const statusBadge = document.getElementById('statusBadge');
    const timeCanvas = document.getElementById('timeCanvas');
    const freqCanvas = document.getElementById('freqCanvas');
    const tCtx = timeCanvas.getContext('2d');
    const fCtx = freqCanvas.getContext('2d');

    // スライダー連動
    thresholdInput.oninput = () => thVal.textContent = parseFloat(thresholdInput.value).toFixed(2);
    timeSpanInput.oninput = () => {
      tsVal.textContent = timeSpanInput.value + 'ms';
      if (lastCapturedWave) renderTimeDomain(lastCapturedWave);
    };
    vScaleInput.oninput = () => {
      vsVal.textContent = parseFloat(vScaleInput.value).toFixed(1) + 'x';
      if (lastCapturedWave) renderTimeDomain(lastCapturedWave);
    };

    // オーディオ・システム変数
    let audioCtx = null;
    let analyser = null;
    let sourceNode = null;
    let currentStream = null;
    let isRunning = false;
    let animFrameId = null;

    // バッファ管理
    const BUFFER_SIZE = 16384;
    const ringBuffer = new Float32Array(BUFFER_SIZE);
    let ringHead = 0;
    const sampleRate = 44100;
    let isTriggerLocked = false;
    let lastCapturedWave = null;
    let lastCapturedFreq = null;

    // Retina解像度対応
    function resizeCanvas(canvas, ctx) {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.resetTransform();
      ctx.scale(dpr, dpr);
    }

    function initCanvases() {
      resizeCanvas(timeCanvas, tCtx);
      resizeCanvas(freqCanvas, fCtx);
      drawTimeGrid();
      drawFreqGrid();
    }
    window.addEventListener('resize', initCanvases);
    setTimeout(initCanvases, 100);

    // デバイス一覧取得
    async function populateMics() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const audioInputs = devices.filter(d => d.kind === 'audioinput');
        const currentVal = micSelect.value;
        micSelect.innerHTML = '';

        audioInputs.forEach((device, index) => {
          const opt = document.createElement('option');
          opt.value = device.deviceId;
          opt.textContent = device.label || `マイク ${index + 1} (${device.deviceId.slice(0, 5)}...)`;
          micSelect.appendChild(opt);
        });

        if (currentVal && Array.from(micSelect.options).some(o => o.value === currentVal)) {
          micSelect.value = currentVal;
        }
      } catch (err) {
        console.warn('マイク一覧取得エラー:', err);
      }
    }

    navigator.mediaDevices.ondevicechange = () => {
      populateMics();
    };

    // トグルボタン処理（開始 ⇔ 停止）
    toggleBtn.addEventListener('click', async () => {
      if (isRunning) {
        stopAudio();
      } else {
        await startAudio();
      }
    });

    // マイク選択変更時のシームレス再起動
    micSelect.addEventListener('change', async () => {
      if (isRunning) {
        stopAudio(false);
        await startAudio();
      }
    });

    async function startAudio() {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 44100 });
        if (audioCtx.state === 'suspended') {
          await audioCtx.resume();
        }

        const deviceConstraint = micSelect.value ? { exact: micSelect.value } : undefined;
        currentStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            deviceId: deviceConstraint,
            autoGainControl: false,
            echoCancellation: false,
            noiseSuppression: false
          }
        });

        // 権限取得後にマイク名が取得できるため一覧を再更新
        await populateMics();

        sourceNode = audioCtx.createMediaStreamSource(currentStream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;
        analyser.smoothingTimeConstant = 0.1;
        sourceNode.connect(analyser);

        isRunning = true;
        toggleBtn.textContent = '録音停止';
        toggleBtn.className = 'action-btn btn-stop';

        processLoop();
      } catch (err) {
        alert('マイク起動に失敗しました: ' + err.message);
      }
    }

    function stopAudio(fullReset = true) {
      isRunning = false;
      if (animFrameId) cancelAnimationFrame(animFrameId);
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
        currentStream = null;
      }
      if (audioCtx) {
        audioCtx.close();
        audioCtx = null;
      }

      if (fullReset) {
        toggleBtn.textContent = 'マイク入力開始';
        toggleBtn.className = 'action-btn btn-start';
        statusBadge.textContent = 'STANDBY';
        statusBadge.className = 'status-badge';
      }
    }

    // 監視・キャプチャループ
    const pcmChunk = new Float32Array(1024);
    function processLoop() {
      if (!isRunning) return;
      animFrameId = requestAnimationFrame(processLoop);

      analyser.getFloatTimeDomainData(pcmChunk);

      // リングバッファへ追加
      for (let i = 0; i < pcmChunk.length; i++) {
        ringBuffer[ringHead] = pcmChunk[i];
        ringHead = (ringHead + 1) % BUFFER_SIZE;
      }

      const threshold = parseFloat(thresholdInput.value);

      // ピーク検出
      let maxVal = 0;
      for (let i = 0; i < pcmChunk.length; i++) {
        const val = Math.abs(pcmChunk[i]);
        if (val > maxVal) maxVal = val;
      }

      // トリガー判定
      if (maxVal > threshold && !isTriggerLocked) {
        isTriggerLocked = true;
        statusBadge.textContent = 'CAPTURED';
        statusBadge.className = 'status-badge captured';

        // 過去データを巻き戻してパルス波形を切り出し
        const captureSamples = Math.floor(sampleRate * 0.7); // 最大700ms蓄積
        const captured = new Float32Array(captureSamples);
        const preSamples = Math.floor(sampleRate * 0.05); // 50msプリトリガー
        let startIdx = (ringHead - pcmChunk.length - preSamples + BUFFER_SIZE) % BUFFER_SIZE;

        for (let i = 0; i < captureSamples; i++) {
          captured[i] = ringBuffer[(startIdx + i) % BUFFER_SIZE];
        }
        lastCapturedWave = captured;
        renderTimeDomain(lastCapturedWave);

        // 周波数スペクトル (FFT) 取得・描画
        const freqData = new Float32Array(analyser.frequencyBinCount);
        analyser.getFloatFrequencyData(freqData);
        lastCapturedFreq = freqData;
        renderFrequency(lastCapturedFreq);

        // 再トリガー防止（1秒クールダウン）
        setTimeout(() => {
          isTriggerLocked = false;
          if (isRunning) {
            statusBadge.textContent = 'STANDBY';
            statusBadge.className = 'status-badge';
          }
        }, 1000);
      }
    }

    // パルス波形 描画ロジック
    function drawTimeGrid(pL = 50, pB = 26, durationMs = 300, scale = 1.0) {
      const rect = timeCanvas.getBoundingClientRect();
      const W = rect.width, H = rect.height;
      tCtx.clearRect(0, 0, W, H);

      tCtx.strokeStyle = '#1d222d';
      tCtx.lineWidth = 1;
      tCtx.fillStyle = '#64748b';
      tCtx.font = '9px "SF Mono", monospace';

      // 縦軸（振幅）
      const vLimit = 1.0 / scale;
      const vSteps = [
        { ratio: 0.0, label: `+${vLimit.toFixed(2)}` },
        { ratio: 0.25, label: `+${(vLimit * 0.5).toFixed(2)}` },
        { ratio: 0.5, label: ` 0.00` },
        { ratio: 0.75, label: `-${(vLimit * 0.5).toFixed(2)}` },
        { ratio: 1.0, label: `-${vLimit.toFixed(2)}` }
      ];

      vSteps.forEach(s => {
        const y = s.ratio * (H - pB);
        tCtx.beginPath();
        tCtx.moveTo(pL, y);
        tCtx.lineTo(W, y);
        tCtx.stroke();
        tCtx.fillText(s.label, 4, y + 3);
      });

      // 横軸（時間 ms）
      const hSteps = 5;
      for (let i = 0; i <= hSteps; i++) {
        const x = pL + (i / hSteps) * (W - pL - 6);
        const ms = Math.round((i / hSteps) * durationMs);
        tCtx.beginPath();
        tCtx.moveTo(x, 0);
        tCtx.lineTo(x, H - pB);
        tCtx.stroke();
        tCtx.fillText(`${ms}ms`, x - 12, H - 8);
      }
    }

    function renderTimeDomain(wave) {
      const durationMs = parseInt(timeSpanInput.value);
      const scale = parseFloat(vScaleInput.value);
      const pL = 50, pB = 26;
      drawTimeGrid(pL, pB, durationMs, scale);

      const rect = timeCanvas.getBoundingClientRect();
      const W = rect.width, H = rect.height;
      const plotW = W - pL - 6;
      const plotH = H - pB;
      const centerY = plotH / 2;

      const numSamples = Math.floor(sampleRate * (durationMs / 1000));
      const step = Math.max(1, Math.floor(numSamples / plotW));

      tCtx.strokeStyle = '#00d2ff';
      tCtx.lineWidth = 1.5;
      tCtx.beginPath();

      for (let x = 0; x < plotW; x++) {
        const sampleIdx = x * step;
        if (sampleIdx >= wave.length) break;
        const val = wave[sampleIdx] * scale;
        const clamped = Math.max(-1, Math.min(1, val));
        const y = centerY - clamped * (plotH / 2);

        if (x === 0) tCtx.moveTo(pL + x, y);
        else tCtx.lineTo(pL + x, y);
      }
      tCtx.stroke();
    }

    // 周波数スペクトル (FFT) 描画ロジック
    function drawFreqGrid(pL = 50, pB = 26) {
      const rect = freqCanvas.getBoundingClientRect();
      const W = rect.width, H = rect.height;
      fCtx.clearRect(0, 0, W, H);

      fCtx.strokeStyle = '#1d222d';
      fCtx.lineWidth = 1;
      fCtx.fillStyle = '#64748b';
      fCtx.font = '9px "SF Mono", monospace';

      // 縦軸 (dB)
      const dBs = [0, -20, -40, -60, -80, -100];
      dBs.forEach((db, i) => {
        const y = (i / (dBs.length - 1)) * (H - pB);
        fCtx.beginPath();
        fCtx.moveTo(pL, y);
        fCtx.lineTo(W, y);
        fCtx.stroke();
        fCtx.fillText(`${db}dB`, 4, y + 3);
      });

      // 横軸 (周波数 0 - 8kHz)
      const freqs = [
        { hz: 0, label: '0Hz' },
        { hz: 1000, label: '1k' },
        { hz: 2000, label: '2k' },
        { hz: 4000, label: '4k' },
        { hz: 6000, label: '6k' },
        { hz: 8000, label: '8k' }
      ];
      freqs.forEach(f => {
        const x = pL + (f.hz / 8000) * (W - pL - 6);
        fCtx.beginPath();
        fCtx.moveTo(x, 0);
        fCtx.lineTo(x, H - pB);
        fCtx.stroke();
        fCtx.fillText(f.label, x - 8, H - 8);
      });
    }

    function renderFrequency(freqData) {
      const pL = 50, pB = 26;
      drawFreqGrid(pL, pB);

      const rect = freqCanvas.getBoundingClientRect();
      const W = rect.width, H = rect.height;
      const plotW = W - pL - 6;
      const plotH = H - pB;

      // 0Hz〜8000Hzに対応するビン数を算出
      const nyquist = sampleRate / 2;
      const maxBin = Math.floor((8000 / nyquist) * freqData.length);
      const barWidth = plotW / maxBin;

      fCtx.fillStyle = '#ff3366';
      for (let i = 0; i < maxBin; i++) {
        const val = Math.max(-100, Math.min(0, freqData[i]));
        const barHeight = ((val + 100) / 100) * plotH;
        fCtx.fillRect(pL + i * barWidth, plotH - barHeight, Math.max(1, barWidth - 0.5), barHeight);
      }
    }
  </script>
</body>
</html>
